services:
  plex-rating-quest:
    build:
      context: .
      dockerfile: Dockerfile
    image: plex-rating-quest:local
    container_name: plex-rating-quest
    restart: unless-stopped
    ports:
      - "${PLEX_RATING_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
