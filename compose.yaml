services:
  plex-rating-quest:
    image: ghcr.io/mrredsun/plex-rating-quest:v4.0.2
    pull_policy: always
    container_name: plex-rating-quest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PLEX_RATING_PORT:-8080}:8080"
    environment:
      SESSION_SECRET_FILE: /run/secrets/session_secret
      PUBLIC_ORIGIN: "${PLEX_RATING_PUBLIC_ORIGIN:?Set the public HTTPS origin in .env}"
      PLEX_ALLOWED_PRIVATE_HOSTS: "${PLEX_ALLOWED_PRIVATE_HOSTS:-}"
      LOG_LEVEL: "${PLEX_RATING_LOG_LEVEL:-info}"
    secrets:
      - session_secret
    volumes:
      - plex-rating-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  plex-rating-data:
    name: plex-rating-quest-data

secrets:
  session_secret:
    file: "${PLEX_RATING_SESSION_SECRET_FILE:-./secrets/session_secret}"
