name: CI and container publishing

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run formatting, linting, types, tests, and build
        run: npm run check

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the deployment image once
        run: docker build --tag plex-rating-quest:${{ github.sha }} .
      - name: Scan the deployment image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: plex-rating-quest:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Sign in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/mrredsun/plex-rating-quest
          SOURCE_TAG: plex-rating-quest:${{ github.sha }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          docker tag "$SOURCE_TAG" "$IMAGE:sha-${GITHUB_SHA}"
          docker tag "$SOURCE_TAG" "$IMAGE:v${VERSION}"
          docker tag "$SOURCE_TAG" "$IMAGE:main"
          docker push "$IMAGE:sha-${GITHUB_SHA}"
          docker push "$IMAGE:v${VERSION}"
          docker push "$IMAGE:main"
